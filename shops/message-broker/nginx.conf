server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_set_header Host gof.zzb.cx;
        proxy_ssl_server_name on;
        proxy_pass https://gof.zzb.cx/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
