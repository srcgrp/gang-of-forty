<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بت‌شاپ | یه پرواز تا خرید روزانه</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="./icons/shopping-cart.svg" />
  </head>
  <body id="top">
    <a class="skip-link" href="#main">پرش به محتوای اصلی</a>
    <div id="notice" class="announcement"></div>
    <header class="site-header">
      <div class="header-top wrap">
        <a class="brand" href="#top">
          <svg
            viewBox="0 0 120 80"
            width="64"
            height="44"
            role="img"
            aria-labelledby="bat-title"
          >
            <title id="bat-title">بت‌شاپ؛ بازگشت به بالای صفحه</title>
            <polygon
              points="60,34 42,22 8,12 16,42 32,39 40,57 52,51 60,70 68,51 80,57 88,39 104,42 112,12 78,22"
              fill="currentColor"
            ></polygon>
            <ellipse
              cx="60"
              cy="39"
              rx="14"
              ry="20"
              fill="currentColor"
            ></ellipse>
            <polygon
              points="48,28 49,8 59,25 71,8 72,28"
              fill="currentColor"
            ></polygon>
            <circle cx="55" cy="32" r="2" fill="#20221f"></circle>
            <circle cx="65" cy="32" r="2" fill="#20221f"></circle>
          </svg>
          <span>
            <strong>بت‌شاپ</strong>
            <small id="slogan"></small>
          </span>
        </a>
        <div class="search-box">
          <label for="product-search">جست‌وجوی محصولات</label>
          <input
            id="product-search"
            type="search"
            aria-controls="search-results"
            disabled
            placeholder="دنبال چی می‌گردی؟"
          />
        </div>
        <button class="cart-button" type="button" aria-label="سبد خرید، ۰ کالا">
          <img src="icons/shopping-cart.svg" alt="" width="48" height="48" />
          <span>سبد خرید</span>
          <b id="cart-count" aria-live="polite">۰</b>
        </button>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="فعال کردن تم تیره"
        >
          <img src="./icons/moon.svg" alt="" width="24" height="24" />
        </button>
        <details class="mobile-menu">
          <summary aria-label="باز و بسته کردن منوی اصلی">
            <img src="icons/menu-2.svg" alt="" width="48" height="48" />
          </summary>
          <nav id="mobile-links" aria-label="منوی موبایل"></nav>
        </details>
      </div>
      <nav class="desktop-nav wrap" aria-label="منوی اصلی">
        <div class="category-menu">
          <button class="category-trigger" type="button">
            ☰ همهٔ دسته‌ها
          </button>
          <div id="category-links" class="category-links"></div>
        </div>
        <div id="main-links" class="main-links"></div>
      </nav>
    </header>
    <main id="main" class="wrap" tabindex="-1">
      <p id="page-status" class="products-status" role="status"></p>
      <p id="cart-message" role="status"></p>
      <section id="search-results" aria-labelledby="search-title" hidden>
        <div class="section-heading">
          <h2 id="search-title">نتایج جست‌وجو</h2>
          <button id="clear-search" class="clear-search" type="button">
            پاک کردن فیلترها
          </button>
        </div>
        <div class="search-filters">
          <div class="filter-field">
            <label for="category-filter">دسته‌بندی محصولات:</label>
            <select id="category-filter" disabled>
              <option value="">همهٔ دسته‌ها</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="product-sort">مرتب‌سازی نتایج:</label>
            <select id="product-sort">
              <option value="default">ترتیب پیش‌فرض</option>
              <option value="price-asc">قیمت پایه: ارزان به گران</option>
              <option value="price-desc">قیمت پایه: گران به ارزان</option>
            </select>
          </div>
        </div>
        <p id="search-status" role="status"></p>
        <div id="search-products" class="sample-products"></div>
      </section>
      <div id="shop-content">
        <div id="banners" class="banners"></div>
        <section id="categories" aria-label="دسته‌بندی‌ها">
          <div id="categories-heading" class="section-heading"></div>
          <div id="category-tiles" class="categories"></div>
        </section>
        <div id="promos" class="promos"></div>
        <div id="carousels"></div>
        <div id="category-products"></div>
      </div>
    </main>
    <footer id="contact">
      <div class="wrap footer-grid">
        <div id="shop-info"></div>
        <nav id="footer-categories" aria-label="دسته‌بندی‌های پایین صفحه"></nav>
        <div id="shop-hours"></div>
      </div>
      <div id="footer-bottom" class="wrap footer-bottom"></div>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
