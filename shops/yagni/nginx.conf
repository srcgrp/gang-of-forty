server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: serve index.html when no file matches, so client-side routes keep working.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: /api/* → https://gof.zzb.cx/api/*
    location /api/ {
        proxy_pass https://gof.zzb.cx/api/;
    }
}
