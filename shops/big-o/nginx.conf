server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send /api/ requests to the real Gang of Forty API.
    location /api/ {
        proxy_pass https://gof.zzb.cx/api/;
        proxy_set_header Host gof.zzb.cx;
        proxy_ssl_server_name on;
    }

    # Unknown paths fall back to index.html so the app can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
