# shops/premature-optimization/nginx.conf: serve the shop, send /api/ to the Gang of Forty API
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass https://gof.zzb.cx/api/;
        proxy_set_header Host gof.zzb.cx;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}