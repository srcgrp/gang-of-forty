name: Liskov Shop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t liskov-shop .

  publish:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ShayanKhoshniyat/liskov-shop'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/shayankhoshniyat/liskov-shop

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read release version
        id: release
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs:
      - check
      - docker

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Preview Environment
        if: github.event_name == 'pull_request'
        run: vercel pull --yes --environment=preview

      - name: Build Preview
        if: github.event_name == 'pull_request'
        run: vercel build

      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        run: vercel deploy --prebuilt

      - name: Pull Production Environment
        if: github.event_name == 'push'
        run: vercel pull --yes --environment=production

      - name: Build Production
        if: github.event_name == 'push'
        run: vercel build --prod

      - name: Deploy Production
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt --prod
