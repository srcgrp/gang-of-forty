    <header class="site-header">
        <div class="promo">
            <p id="shop-notice"></p>
        </div>
        <input type="checkbox" id="nav-toggle" class="nav-toggle sr-only" aria-label="باز و بسته کردن منو" aria-controls="main-nav">
        <div class="header-top container">
            <a class="brand" href="#top" aria-label="ریفکتور؛ بازگشت به ابتدای صفحه">
                <svg class="logo" width="214" height="56" viewBox="0 0 214 56" aria-hidden="true">
                    <use href="#logo" />
                </svg>
                <span id="shop-slogan" class="shop-slogan"></span>
            </a>
            <div class="header-actions">
                <span class="icon-btn" id="cart-count" role="img" aria-label="سبد خرید، ۰ کالا">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-cart" />
                    </svg><span class="badge cart-badge" aria-hidden="true">۰</span>
                </span>
                <label for="nav-toggle" class="nav-toggle-btn"><span class="sr-only">منو</span>
                    <svg class="icon icon-open" aria-hidden="true">
                        <use href="#i-menu" />
                    </svg>
                    <svg class="icon icon-close" aria-hidden="true">
                        <use href="#i-close" />
                    </svg>
                </label>
            </div>
            <search class="search">
                <form id="search-form" action="." method="get">
                    <div class="search-box">
                        <label class="sr-only" for="q">جستجو در محصولات</label>
                        <input id="q" type="search" name="q" placeholder="جستجو در محصولات…" autocomplete="off">
                        <button class="search-btn" type="submit" aria-label="جستجو"><svg class="icon"
                                aria-hidden="true">
                                <use href="#i-search" />
                            </svg></button>
                    </div>
                </form>
            </search>
        </div>
        <div class="nav-bar" id="main-nav">
            <div class="nav-inner container">
                <nav aria-label="منوی اصلی">
                    <ul class="nav-links" id="main-menu"></ul>
                </nav>
                <address class="contact"><a id="header-phone"></a></address>
            </div>
        </div>
    </header>

    <main id="content" tabindex="-1">
        <h1 class="sr-only">ریفکتور؛ سوپرمارکت آنلاین</h1>
        <p id="runtime-notice" class="runtime-notice container" role="status" hidden></p>
        <div class="load-state container" id="load-state" aria-busy="true"></div>
        <div id="shop-content" hidden>
            <section class="hero container" id="hero" aria-label="پیشنهادهای فروشگاه">
                <div class="hero-grid" id="hero-grid"></div>
            </section>
            <section class="cats container" id="categories" aria-labelledby="cats-title">
                <div class="section-head">
                    <h2 class="section-title" id="cats-title">دسته‌بندی محصولات</h2>
                </div>
                <ul class="cat-list"></ul>
            </section>
            <section class="catalog-section container" id="catalog" aria-labelledby="catalog-title" hidden>
                <div class="section-head">
                    <h2 class="section-title" id="catalog-title">کالاهای فروشگاه</h2>
                    <button class="btn" id="reset-filters" type="button">بازگشت به فروشگاه</button>
                </div>
                <p id="result-count" class="result-count" role="status"></p>
                <ul class="catalog-grid" id="catalog-grid" hidden></ul>
            </section>
            <div id="products">
                <div id="home-sections"></div>
                <div id="fragment-section"></div>
            </div>
        </div>
        <noscript>
            <p class="container runtime-notice"></p>
        </noscript>
    </main>
    <!-- footer section -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-top">
                <div class="footer-cols"></div>
            </div>
            <div class="footer-bottom">
                <div class="footer-contact" id="contact"></div>
                <div class="footer-about" id="about"></div>
            </div>
            <div class="footer-copy">
                <p class="footer-copy-right"></p>
            </div>
            <div class="footer-to-top-wrap">
                <a class="footer-to-top" href="#top" aria-label="بازگشت به بالای صفحه">
                    <svg class="icon" aria-hidden="true">
                        <use href="#i-arrow-up" />
                    </svg>
                </a>
            </div>
        </div>
    </footer>
    <script src="./src/main.ts" type="module"></script>
</body>

</html>
