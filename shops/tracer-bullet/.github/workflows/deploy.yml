name: CI and deploy
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: "deploy-${{ github.ref }}", cancel-in-progress: true }
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check
      - run: npm run test --if-present -- --run
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shop .
  deploy:
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "### $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: node -p '"ref=ghcr.io/elenamomeni-art/tracer-bullet-shop:" + require("./package.json").version' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: "${{ steps.image.outputs.ref }},ghcr.io/elenamomeni-art/tracer-bullet-shop:latest"
          labels: org.opencontainers.image.source=https://github.com/elenamomeni-art/tracer-bullet-shop
      - run: |
          image="${{ steps.image.outputs.ref }}"
          docker pull "$image"
          trap 'docker rm -f shop' EXIT
          docker run -d -p 8080:80 --name shop "$image"
          curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://localhost:8080/
