name: Build and deploy Nardone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  VITE_API_URL: /api

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the container image
        run: docker build -t semver-shop .
      - name: Check the storefront and API inside Docker
        run: |
          docker run --detach --name semver-shop --publish 127.0.0.1:8080:80 semver-shop
          cleanup() {
            if (( $? != 0 )); then
              docker logs semver-shop || true
            fi
            docker rm --force semver-shop >/dev/null
          }
          trap cleanup EXIT

          echo 'Wait for Nginx to serve the storefront'
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/ --output /tmp/semver-index.html

          echo 'Check the SPA fallback'
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/check-spa-fallback --output /tmp/semver-fallback.html
          cmp /tmp/semver-index.html /tmp/semver-fallback.html

          echo 'Check the upstream products through the proxy'
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/products.json | jq -e 'type == "array" and length > 0'

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo 'Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in the repository secrets.' >&2
            exit 1
          fi

          environment=preview
          deploy_flags=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            environment=production
            deploy_flags=(--prod)
          fi

          vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN"
          vercel build "${deploy_flags[@]}" --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt "${deploy_flags[@]}" --token="$VERCEL_TOKEN")
          printf '### Vercel %s\n\n%s\n' "$environment" "$url" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'amirnasr-dev/semver-shop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read image name and version
        id: image
        run: |
          version=$(jq -er '.version | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' package.json)
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        run: docker buildx create --use
      - name: Publish the current version and latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Prepare the original 1.0.0 release if it needs an image
        id: original
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          RELEASE_COMMIT: d40f63b20d0d2d33834a74c7aec14fc2efb1bb60
        run: |
          if [[ "$VERSION" == 1.0.0 ]]; then
            exit 0
          fi
          if inspect=$(docker buildx imagetools inspect "$IMAGE:1.0.0" 2>&1); then
            exit 0
          fi
          if ! grep -qiE 'not found|manifest unknown' <<< "$inspect"; then
            printf '%s\n' "$inspect" >&2
            exit 1
          fi
          release_dir=$(mktemp -d "$RUNNER_TEMP/nardone-1.0.0.XXXXXX")
          git archive "$RELEASE_COMMIT" | tar -xf - -C "$release_dir"
          echo "context=$release_dir" >> "$GITHUB_OUTPUT"
          echo "revision=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Publish the original 1.0.0 image
        if: steps.original.outputs.context != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.original.outputs.context }}
          push: true
          tags: ${{ steps.image.outputs.name }}:1.0.0
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=1.0.0
            org.opencontainers.image.revision=${{ steps.original.outputs.revision }}
      - name: Run the published 1.0.0 image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --pull always --detach --name nardone-ghcr --publish 127.0.0.1:8080:80 "$IMAGE:1.0.0"
          trap 'docker rm --force nardone-ghcr >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:8080/ --output /dev/null
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8080/api/products.json | jq -e 'type == "array" and length > 0'
